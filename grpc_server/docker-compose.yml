services:
  power-grid-grpc-server:
    build:
      context: ..
      dockerfile: grpc_server/Dockerfile
    ports:
      - "50052:50052"
    environment:
      GRPC_PORT: "50052"
      GRPC_SHUTDOWN_TIMEOUT_SECONDS: "10"
    # HEALTHCHECK is already baked into the image (see Dockerfile); restart:unless-stopped pairs with it so an
    # orchestrator (here, just the Docker daemon) restarts the container if it ever crashes or hangs.
    restart: unless-stopped
